<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Smart Course Companion</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages/login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="card login-card">
        <header class="login-header">
          <h1 class="login-title">Smart Course Companion</h1>
          <p class="login-subtitle">Sign in to manage your courses and deadlines.</p>
        </header>

        <form>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" id="email" type="email" placeholder="student@school.edu" />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" id="password" type="password" placeholder="••••••••" />
          </div>

          <div class="login-actions">
            <button class="btn btn-primary" type="submit">Log In</button>
            <a class="btn btn-outline" href="./dashboard.html">Continue to Dashboard</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
