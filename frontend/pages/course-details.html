<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Details | Smart Course Companion</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages/course-details.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand">Smart Course Companion</div>
        <nav class="sidebar-nav">
          <a class="nav-link" href="./dashboard.html">Dashboard</a>
          <a class="nav-link" href="./courses.html">Courses</a>
          <a class="nav-link active" href="./course-details.html">Course Details</a>
          <a class="nav-link" href="./admin.html">Admin</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <h1 class="topbar-title">SOEN 287 - Web Programming</h1>
          <button class="btn btn-primary" type="button">Add Assignment</button>
        </header>

        <section class="details-grid">
          <article class="card">
            <h2 class="card-title">Assignments</h2>
            <ul class="assignment-list">
              <li class="assignment-item">
                <span>Mini Project - CSS Architecture</span>
                <span class="badge badge-warning">Due Feb 28</span>
              </li>
              <li class="assignment-item">
                <span>Lab 4 - Responsive Layout</span>
                <span class="badge badge-success">Submitted</span>
              </li>
            </ul>
          </article>

          <aside class="card">
            <h2 class="card-title">Course Info</h2>
            <p class="card-subtitle">Instructor: Dr. Smith</p>
            <p class="card-subtitle">Room: EV 2.125</p>
            <p class="card-subtitle">Schedule: Tue/Thu 14:00</p>
          </aside>
        </section>
      </main>
    </div>
  </body>
</html>
