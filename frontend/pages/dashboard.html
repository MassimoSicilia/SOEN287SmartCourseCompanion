<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Smart Course Companion</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages/dashboard.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand">Smart Course Companion</div>
        <nav class="sidebar-nav">
          <a class="nav-link active" href="./dashboard.html">Dashboard</a>
          <a class="nav-link" href="./courses.html">Courses</a>
          <a class="nav-link" href="./course-details.html">Course Details</a>
          <a class="nav-link" href="./admin.html">Admin</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <h1 class="topbar-title">Dashboard</h1>
          <div class="topbar-actions">
            <button class="btn btn-outline" type="button">Notifications</button>
            <img class="avatar" src="../assets/icons/user.png" alt="User profile" />
          </div>
        </header>

        <section class="content-grid grid-3 dashboard-highlights">
          <article class="card">
            <div class="stat-value">5</div>
            <div class="stat-label">Active Courses</div>
          </article>
          <article class="card">
            <div class="stat-value">3</div>
            <div class="stat-label">Upcoming Deadlines</div>
          </article>
          <article class="card">
            <div class="stat-value">89%</div>
            <div class="stat-label">Average Grade</div>
          </article>
        </section>

        <section class="card">
          <h2 class="card-title">Upcoming Work</h2>
          <ul class="upcoming-list">
            <li class="upcoming-item">
              <div>
                <p>SOEN 287 - Assignment 2</p>
                <p class="upcoming-meta">Due Feb 22</p>
              </div>
              <span class="badge badge-warning">Soon</span>
            </li>
            <li class="upcoming-item">
              <div>
                <p>COMP 352 - Project Milestone</p>
                <p class="upcoming-meta">Due Feb 25</p>
              </div>
              <span class="badge badge-success">On Track</span>
            </li>
          </ul>
        </section>
      </main>
    </div>
  </body>
</html>
