<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Course Companion | Loading Course</title>
    <link rel="stylesheet" href="../../css/pages/header.css">
    <link rel="stylesheet" href="../../css/pages/courseAdmin.css">
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
      defer
    ></script>
    <script src="../../javascript/supabaseClient.js" defer></script>
    <script src="../../javascript/apiClient.js" defer></script>
    <script src="../../javascript/courseDataStore.js" defer></script>
    <script src="../../javascript/headerAdmin.js" defer></script>
    <script src="../../javascript/courseAdmin.js" defer></script>
</head>
<body>
    <div id="site-header" data-header-title="Course" data-active-menu="course" data-header-src="headerAdmin.html"></div>
    <div class="container">
        <div class = "page-header">
            <h1 id="course-title">Loading course...</h1>
            <button id = "addAssignmentBtn" class="add-assignment-btn">Add New Assessment</button>
            <button id = "editCourseBtn" class="edit-course-btn">Edit Course Details</button>
            <button id="saveTemplateBtn" class="edit-course-btn">Save As Template</button>
            <button id = "sortDueDateBtn" class="sort-due-btn">Sort by Due Date</button>
        </div>

        <div class="categories-box">
            <div class = "categories">
                <h2>Name</h2>
                <h2>Weight</h2>
                <h2>Due Date</h2>
                <h2>Completion Status</h2>
                <h2>Completion Status (%)</h2>
            </div>
        </div>
        <div id="template-action-message" class="template-action-message"></div>

    </div>
</body>
</html>
