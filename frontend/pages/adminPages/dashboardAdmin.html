<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Course Companion | Admin Dashboard</title>
    <link rel="stylesheet" href="../../css/pages/header.css" />
    <link rel="stylesheet" href="../../css/pages/dashboardAdmin.css" />
    <script src="../../javascript/headerAdmin.js" defer></script>
    <script src="../../javascript/dashboardAdmin.js" defer></script>
  </head>
  <body>
    <div
      id="site-header"
      data-header-title="Dashboard"
      data-active-menu="dashboard"
      data-header-src="headerAdmin.html"
    ></div>
    <div class="courses-div">
      <div class="courses-header">
        <div class="courses-title">
          <h2>Courses</h2>
        </div>
        <div class="create-courses-class">
          <button id="create-course-btn" class="create-courses-button">
            Create Course
          </button>
        </div>
      </div>
      <div class="courses-list">
        <div class="course-card">
          <h3>SOEN 287 - Web Development</h3>
          <p><span class="course-label">Prof:</span> John Doe</p>
          <p><span class="course-label">Section:</span> UU</p>
          <p><span class="course-label">Term:</span> Winter 2026</p>
        </div>
        <div class="course-card">
          <h3>SOEN 228 - System Hardware</h3>
          <p><span class="course-label">Prof:</span> Jane Smith</p>
          <p><span class="course-label">Section:</span> AB</p>
          <p><span class="course-label">Term:</span> Winter 2026</p>
        </div>
        <div class="course-card">
          <h3>COMP 352 - Data Structures and Algorithms</h3>
          <p><span class="course-label">Prof:</span> Mark Lee</p>
          <p><span class="course-label">Section:</span> CC</p>
          <p><span class="course-label">Term:</span> Winter 2026</p>
        </div>
      </div>
    </div>
    <!-- modal to create a new course-->
    <div id="create-course-modal" class="modal">
      <div class="modal-content">
        <span id="close-create-course-modal" class="close">&times;</span>
        <h2>Create New Course</h2>
        <form id="create-course-form">
          <label for="course-name">Course Name:</label>
          <input type="text" id="course-name" name="course-name" required />

          <label for="course-code">Course Code:</label>
          <input type="text" id="course-code" name="course-code" required />

          <label for="section">Section:</label>
          <input type="text" id="section" name="section" required />

          <label for="term">Term:</label>
          <input type="text" id="term" name="term" required />

          <label for="professor">Professor:</label>
          <input type="text" id="professor" name="professor" required />

          <button type="submit" class="submit-btn">Create Course</button>
        </form>
      </div>
    </div>
  </body>
</html>
