<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Course Companion | Admin Analytics</title>
    <script src="../../javascript/theme.js"></script>
    <link rel="stylesheet" href="../../css/pages/header.css" />
    <link rel="stylesheet" href="../../css/pages/analyticsAdmin.css" />
    <link rel="stylesheet" href="../../css/pages/theme.css" />
    <script src="../../javascript/headerAdmin.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
      defer
    ></script>
    <script src="../../javascript/supabaseClient.js" defer></script>
    <script src="../../javascript/analyticsAdmin.js" defer></script>
  </head>
  <body>
    <div
      id="site-header"
      data-header-title="Analytics"
      data-active-menu="analytics"
    ></div>

    <div class="analyticsContainer">
      <section id="courseGradeBarGraph" class="grade-graph-card">
        <h2>Class Average by Course</h2>
        <div
          id="barChartContainer"
          aria-label="Bar chart showing class averages per course"
        ></div>
      </section>
      <div id="gradeDiv">
        <section id="submissionRateSection" class="grade-graph-card">
          <h2>Submission Rate</h2>
          <div
            id="submissionRateContainer"
            aria-label="Circular progress bar showing submission rate"
            class="circularProgress"
            aria-valuemax="100"
            aria-valuemin="0"
            aria-valuenow="91"
            style="--value: 91"
            role="progressbar"
          >
            <p>91%</p>
          </div>
        </section>
        <section id="totalStudentsSection" class="grade-graph-card">
          <h2>Total Students</h2>
          <div id="studentCountContainer" aria-label="Card showing total students">
            <p>248</p>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
