<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Courses | Smart Course Companion</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages/courses.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand">Smart Course Companion</div>
        <nav class="sidebar-nav">
          <a class="nav-link" href="./dashboard.html">Dashboard</a>
          <a class="nav-link active" href="./courses.html">Courses</a>
          <a class="nav-link" href="./course-details.html">Course Details</a>
          <a class="nav-link" href="./admin.html">Admin</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="courses-header">
          <h1 class="topbar-title">My Courses</h1>
          <button class="btn btn-primary" id="addCourseBtn" type="button">
            Add Course
          </button>
        </header>
        <!-- Section where all classes will be displayed in a grid format. 
        Each course will have a card with its details and options to edit or 
        delete the course. The "Add Course" button will open a modal form to input new course information. -->
        <section class="content-grid grid-2" id="coursesGrid"></section>

        <!-- modal to prompt user to input new course details -->
        <div class="modal-overlay" id="addCourseModal" aria-hidden="true">
          <div
            class="modal card"
            role="dialog"
            aria-modal="true"
            aria-labelledby="addCourseTitle"
          >
            <h2 class="card-title" id="addCourseTitle">Add Course</h2>
            <form id="addCourseForm">
              <div class="form-group">
                <label class="form-label" for="courseCode">Course Code</label>
                <input
                  class="form-input"
                  id="courseCode"
                  name="courseCode"
                  type="text"
                  placeholder="SOEN 287"
                  required
                />
              </div>
              <!-- course details-->
              <div class="form-group">
                <label class="form-label" for="courseName">Course Name</label>
                <input
                  class="form-input"
                  id="courseName"
                  name="courseName"
                  type="text"
                  placeholder="Web Programming"
                  required
                />
              </div>

              <div class="form-group">
                <label class="form-label" for="courseTerm">Term</label>
                <input
                  class="form-input"
                  id="courseTerm"
                  name="courseTerm"
                  type="text"
                  placeholder="Winter 2026"
                  required
                />
              </div>

              <div class="form-group">
                <label class="form-label" for="courseDescription"
                  >Short Description</label
                >
                <textarea
                  class="form-textarea"
                  id="courseDescription"
                  name="courseDescription"
                  placeholder="Brief summary of the course..."
                  required
                ></textarea>
              </div>

              <div class="modal-actions">
                <button
                  class="btn btn-outline"
                  id="cancelAddCourseBtn"
                  type="button"
                >
                  Cancel
                </button>
                <button class="btn btn-primary" type="submit">
                  Add Course
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>

    <script src="../js/courses.js"></script>
  </body>
</html>
