<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Course Companion | Student Dashboard</title>
    <link rel="stylesheet" href="../../css/pages/header.css">
    <link rel="stylesheet" href="../../css/pages/dashboardStudent.css">
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
      defer
    ></script>
    <script src="../../javascript/supabaseClient.js" defer></script>
    <script src="../../javascript/courseDataStore.js" defer></script>
    <script src="../../javascript/headerStudent.js" defer></script>
    <script src="../../javascript/dashboardStudent.js" defer></script>
</head>
<body>
    <div id="site-header" data-header-title="Dashboard" data-active-menu="dashboard"></div>
    <div class="upcoming-assessments-container">
      <div class="upcoming-assessments-box">
        <div class="assessments-list-header">
          <h2>Upcoming Assignments</h2>
        </div>

        <div class="assignment-row assignment-row-head">
          <span>Task</span>
          <span>Due</span>
          <span>Status</span>
        </div>
        <div id="upcomingAssignmentsList"></div>
      </div>
    </div>
    <div class="courses-div">
      <div class="courses-header">
        <div class="courses-title">
          <h2>Courses</h2>
          <p id="courses-status-message" class="courses-status-message" aria-live="polite"></p>
        </div>
        <div class="add-courses-class">
          <button id="add-course-btn" class="add-courses-button">
            Add Course
          </button>
        </div>
      </div>
      <div class="courses-list" id="courses-list"></div>
    </div>

    <!-- Modal for adding courses -->
    <section id="addCourseModalSection">
      <div>
        <div id="addCourseModal" class="modal">
          <div class="modal-content">
            <span id="closeAddCourseModal" class="close">&times;</span>
            <h2>Add Course</h2>
            <form id="addCourseForm">
              <label for="courseOfferingSelect">Available Course:</label>
              <select
                id="courseOfferingSelect"
                name="courseOfferingSelect"
                required
              >
                <option value="">Choose a course</option>
              </select>

              <p id="selected-course-preview" class="selected-course-preview">
                Select a course to see its details.
              </p>

              <button type="submit">Add Course</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
