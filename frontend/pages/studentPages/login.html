<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Course Companion Login</title>
    <link rel="stylesheet" href="../../css/pages/login.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
      defer
    ></script>
    <script src="../../javascript/supabaseClient.js" defer></script>
    <script src="../../javascript/login.js" defer></script>
    <script src="../../javascript/account.js" defer></script>
    <script src="../../javascript/AccountStore.js" defer></script>
  </head>
  <body>
    <div class="loginContainer" id="loginDiv">
      <h2>Login to Smart Course Companion</h2>
      <form id="loginForm">
        <div>
          <label for="email">Email:</label><br />
          <input type="email" id="email" name="email" required /><br />
        </div>
        <div>
          <label for="password">Password:</label><br />
          <input type="password" id="password" name="password" required /><br />
        </div>
        <input type="submit" value="Login" />

        <div id="createAccountContainer">
          <a href="signUp.html">Create Account</a>
        </div>
      </form>
    </div>
  </body>
</html>
