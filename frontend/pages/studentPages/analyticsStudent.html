<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Course Companion | Student Analytics</title>
    <link rel="stylesheet" href="../../css/pages/header.css" />
    <link rel="stylesheet" href="../../css/pages/analyticsStudent.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
      defer
    ></script>
    <script src="../../javascript/supabaseClient.js" defer></script>
    <script src="../../javascript/apiClient.js" defer></script>
    <script src="../../javascript/courseDataStore.js" defer></script>
    <script src="../../javascript/headerStudent.js" defer></script>
    <script src="../../javascript/analyticsStudent.js" defer></script>
  </head>
  <body>
    <div id="site-header" data-header-title="Analytics" data-active-menu="analytics"></div>

    <div class="analyticsContainer">
      <section id="courseGradeBarGraph" class="grade-graph-card">
        <h2>Current Grade by Course</h2>
        <div
          id="barChartContainer"
          aria-label="Bar chart showing grades per course"
        ></div>
      </section>
      <div id="gradeDiv">
        <section id="TotalGradeSection" class="grade-graph-card">
          <h2>Current Average</h2>
          <div
            id="totalGradeContainer"
            aria-label="Circular progress bar showing total grade"
            class="circularProgress"
            aria-valuemax="100"
            aria-valuemin="0"
            aria-valuenow="87"
            style="--value: 87"
            role="progressbar"
          >
            <p>87%</p>
          </div>
        </section>
        <section id="GPAsection" class="grade-graph-card">
          <h2>GPA</h2>
          <div id="gpaContainer" aria-label="Circular progress bar showing GPA">
            <p>3.5</p>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
