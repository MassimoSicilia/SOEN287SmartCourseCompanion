<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Course Companion | Loading Course</title>
    <link rel="stylesheet" href="../../css/pages/header.css" />
    <link rel="stylesheet" href="../../css/pages/courseStudent.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
      defer
    ></script>
    <script src="../../javascript/supabaseClient.js" defer></script>
    <script src="../../javascript/apiClient.js" defer></script>
    <script src="../../javascript/courseDataStore.js" defer></script>
    <script src="../../javascript/headerStudent.js" defer></script>
    <script src="../../javascript/courseStudent.js" defer></script>
  </head>

  <body>
    <div
      id="site-header"
      data-header-title="Course"
      data-active-menu="course"
      data-header-src="headerStudent.html"
    ></div>
    <div class="container">
      <div class="page-header">
        <h1 id="course-title">Loading course...</h1>
        <button id="sortDueDateBtn" class="sort-due-btn">
          Sort by Due Date
        </button>
      </div>

      <div class="button-row">
        <button id="inProgressBtn" class="tab">In progress</button>
        <button id="completedBtn" class="tab">Completed</button>
      </div>

      <div class="categories-box">
        <div class="categories">
          <h2>Name</h2>
          <h2>Weight</h2>
          <h2>Due Date</h2>
          <h2>Grade</h2>
          <h2>Status</h2>
        </div>
      </div>

      <div id="courseStatusMessage" class="course-status-message" aria-live="polite"></div>
      <div id="inProgressContent" class="tab-content"></div>
      <div id="completedContent" class="tab-content"></div>
    </div>
  </body>
</html>
